[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegdash-llm-api"
version = "1.0.0"
description = "API service for EEGDash LLM Tagger with caching and orchestration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11.5"
authors = [
    { name = "EEGDash Team" }
]
keywords = ["eeg", "meg", "neuroimaging", "tagging", "api", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "fastapi>=0.165.0",  # FastAPI(max_body_size=...)
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    # Queue and database
    "psycopg[binary]>=3.1.0",  # Postgres driver (async-capable)
    "pymongo>=4.18.3",         # MongoDB driver for tag updates (BSON GHSA floor)
    # pip installs from git; uv (dev) uses the sibling checkout below.
    "eegdash-tagger @ git+https://github.com/eegdash/eegdash-llm-tagger.git@main",
    "python-dotenv>=1.2.2",
    # Security floors for transitive deps (GHSA advisories, Nov 2026 review).
    # deploy/Dockerfile.prod resolves fresh with pip, so these are what bind.
    "anyio>=4.14.2",
    "starlette>=1.3.1",
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    "dnspython>=2.9.2",
    "soupsieve>=4.0.0",
    "requests>=2.33.0",
    "idna>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/eegdash/eegdash-llm-api"
Repository = "https://github.com/eegdash/eegdash-llm-api"

[tool.uv.sources]
# Expects eegdash-llm-tagger cloned next to this repo.
eegdash-tagger = { path = "../eegdash-llm-tagger", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
